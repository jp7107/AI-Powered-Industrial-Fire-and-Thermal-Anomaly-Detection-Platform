version: '3.8'

services:
  # 1. PostGIS Database
  db:
    image: postgis/postgis:16-3.4
    container_name: thermowatch-db
    environment:
      POSTGRES_DB: thermowatch
      POSTGRES_USER: thermowatch
      POSTGRES_PASSWORD: ${DB_PASSWORD:-thermowatch_secure_2026}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thermowatch"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & SSE Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: thermowatch-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  # 3. FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thermowatch-api
    environment:
      - DATABASE_URL=postgresql://thermowatch:${DB_PASSWORD:-thermowatch_secure_2026}@db:5432/thermowatch
      - REDIS_URL=redis://redis:6379/0
      - FIRMS_MAP_KEY=${FIRMS_MAP_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # 4. Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: thermowatch-ui
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
